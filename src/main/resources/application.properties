spring.application.name=countryInfo
logging.level.org.springframework.ws.client.MessageTracing.sent=TRACE
logging.level.org.springframework.ws.client.MessageTracing.received=TRACE

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:mydb}?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:secret}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Expose only the management endpoints needed initially
management.endpoints.web.exposure.include=health,info,metrics,prometheus

# Health endpoint
management.endpoint.health.show-details=never

# Kubernetes health probes
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true


management.info.build.enabled=true

management.info.env.enabled=true
info.app.name=CountryInfo API
info.app.description=REST API for country and language information
info.app.version=1.0.0


management.endpoint.health.group.readiness.include=readinessState,db


# Output logs as structured JSON
logging.structured.format.console=logstash

# Default application logging
logging.level.root=INFO
logging.level.com.api.countryinfo=INFO

# More detail for SOAP troubleshooting when needed
logging.level.org.springframework.ws.client=INFO


management.tracing.sampling.probability=1.0


management.endpoint.prometheus.access=read-only