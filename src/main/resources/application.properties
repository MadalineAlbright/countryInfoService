spring.application.name=countryInfo

#DB configuration
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Expose only the management endpoints needed initially
management.endpoints.web.exposure.include=health,info

# Health endpoint
management.endpoint.health.show-details=never

# Kubernetes health probes
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

management.info.build.enabled=true
management.info.env.enabled=true
info.app.name=CountryInfo API
info.app.description=REST API for country and language information
info.app.version=1.0.0

management.endpoint.health.group.readiness.include=readinessState,db

# Output logs as structured JSON
logging.structured.format.console=logstash

# Default application logging
logging.level.root=INFO
logging.level.com.api.countryinfo=INFO

# More detail for SOAP troubleshooting when needed
logging.level.org.springframework.ws.client=INFO
logging.level.org.springframework.ws.client.MessageTracing.sent=TRACE
logging.level.org.springframework.ws.client.MessageTracing.received=TRACE